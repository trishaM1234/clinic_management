services:
  - type: web
    name: clinic-appointment
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: AUTH_TOKEN
        generateValue: true

      # SQLite (demo): local file (for persistence, add Render volume).
      - key: SQLITE_PATH
        value: "clinic.db"



