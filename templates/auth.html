<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Register</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
</head>

<body>

    <header class="navbar">
        <div class="brand">Clinic Monitoring</div>
        <nav>
            <a href="/">Home</a>
        </nav>
    </header>

    <main class="auth-page">

        <section class="auth-panel">

            <div class="tabs">
                <button id="login-tab" class="tab active">Sign In</button>
                <button id="register-tab" class="tab">Sign Up</button>
            </div>

            <div id="message" class="message"></div>

            <!-- LOGIN FORM -->
            <form id="login-form" class="auth-form active">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="you@example.com" required />

                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter password" required />

                <button type="submit" class="button">Login</button>
            </form>

            <!-- REGISTER FORM -->
            <form id="register-form" class="auth-form">
                <label>Full Name</label>
                <input type="text" id="register-name" placeholder="Jane Doe" required />

                <label>Email</label>
                <input type="email" id="register-email" placeholder="you@example.com" required />

                <label>Password</label>
                <input type="password" id="register-password" placeholder="Minimum 6 characters" required />

                <button type="submit" class="button">Register</button>
            </form>

        </section>

    </main>

    <script src="/static/js/auth.js"></script>

</body>
</html>
